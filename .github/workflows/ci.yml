name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -failfast -v ./...

      - name: Coverage
        if: matrix.go-version == '1.25'
        run: go test -coverprofile=coverage.out ./mcpotel/

      - name: Upload coverage
        if: matrix.go-version == '1.25'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # Catches an // indirect drift before it reaches a consumer. This module
      # is imported by the server repos, so an untidy go.mod here propagates.
      # Lives in the lint job rather than test so it runs once, not per matrix
      # entry.
      - name: go mod tidy is clean
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go mod tidy produced changes; commit them"
            git diff go.mod go.sum
            exit 1
          fi

      - name: go vet
        run: go vet ./...
