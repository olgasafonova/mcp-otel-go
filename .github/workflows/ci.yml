name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -failfast -v ./...

      - name: Coverage
        if: matrix.go-version == '1.25'
        run: go test -coverprofile=coverage.out ./mcpotel/

      - name: Upload coverage
        if: matrix.go-version == '1.25'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      # Catches an // indirect drift before it reaches a consumer. This module
      # is imported by the server repos, so an untidy go.mod here propagates.
      # Lives in the lint job rather than test so it runs once, not per matrix
      # entry.
      - name: go mod tidy is clean
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go mod tidy produced changes; commit them"
            git diff go.mod go.sum
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  # Stable aggregate context. Required-status-check lists name this job and
  # never a matrix leg: a leg's context embeds its matrix values ("test (1.25)"),
  # so bumping the Go version renames the context and branch protection then
  # waits forever for a name nothing emits. That is not hypothetical - it blocked
  # every PR merge on miro-mcp-server from 23-12-2025 to 26-08-2026.
  #
  # `if: always()` is what makes the assertion below possible. Without it this
  # job is skipped whenever a dependency fails, is skipped, or is cancelled, and
  # GitHub counts a skipped required check as satisfied. With it the job always
  # runs, and the step fails on any dependency result that is not exactly
  # "success" - failure, skipped and cancelled all fail the aggregate. For a
  # matrix dependency, needs.<job>.result is the roll-up over every leg.
  all-checks:
    name: all-checks
    if: always()
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Assert every dependency succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS"
          bad=$(printf '%s' "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::Aggregate failed; these jobs did not succeed:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All dependencies succeeded."
